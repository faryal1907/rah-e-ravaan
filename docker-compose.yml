services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16
    container_name: rah-e-ravaan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rah_e_ravaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-rah_e_ravaan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rah_e_ravaan} -d ${POSTGRES_DB:-rah_e_ravaan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rah-e-ravaan-network
    restart: unless-stopped

  # Redis Cache Service
  redis:
    image: redis:7
    container_name: rah-e-ravaan-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rah-e-ravaan-network
    restart: unless-stopped

  # Qdrant Vector Database Service
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rah-e-ravaan-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rah-e-ravaan-network
    restart: unless-stopped

  # Backend API Service
  backend:
    build:
      context: ./backend
      target: development
    container_name: rah-e-ravaan-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rah_e_ravaan}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-rah_e_ravaan}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rah-e-ravaan-network
    restart: unless-stopped

  # Web Frontend Service (Optional - for development)
  # Uncomment to include web frontend: docker-compose --profile with-web up
  # web:
  #   build:
  #     context: ./web
  #     dockerfile: Dockerfile.dev
  #   container_name: rah-e-ravaan-web
  #   environment:
  #     VITE_API_URL: http://localhost:8000
  #   volumes:
  #     - ./web:/app
  #     - /app/node_modules
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:5173/ || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 20s
  #   networks:
  #     - rah-e-ravaan-network
  #   restart: unless-stopped
  #   profiles:
  #     - with-web

# Named Volumes for Data Persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

# Network Configuration
networks:
  rah-e-ravaan-network:
    driver: bridge
